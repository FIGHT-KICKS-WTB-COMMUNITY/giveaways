<style>
  :root {
    color-scheme: dark;
    /* Palette: Discord dark surfaces + Fight Kicks monochrome */
    --bg: #1E1F22;
    --surface: #2B2D31;
    --surface-2: #313338;
    --surface-3: #383A40;
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.16);
    --text: #F2F3F5;
    --dim: #B5BAC1;
    --faint: #949BA4;
    --ok: #23A55A;
    --ok-text: #57F287;
    --live: #F0B232;
    --blurple: #5865F2;
    --blurple-hi: #6D78F5;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --col: 760px;
    --gut: clamp(16px, 4vw, 28px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.6 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: clip;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }
  ::selection { background: var(--blurple); color: #fff; }
  .wrap { width: min(var(--col), 100%); margin-inline: auto; padding-inline: var(--gut); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── Hero ────────────────────────────────── */
  .hero {
    position: relative; isolation: isolate; text-align: center;
    padding: clamp(48px, 8vw, 88px) 0 clamp(32px, 5vw, 48px);
    background:
      radial-gradient(900px 420px at 50% -12%, rgba(255, 255, 255, 0.075), transparent 65%),
      linear-gradient(180deg, #131315 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 20px 0 0;
    font: 400 clamp(38px, 8.5vw, 68px)/1 'Archivo Black', 'Inter', sans-serif;
    letter-spacing: -0.015em; text-transform: uppercase;
    text-wrap: balance;
  }
  .sub { margin: 18px auto 0; max-width: 46ch; color: var(--dim); font-size: 16.5px; text-wrap: balance; }

  .stats {
    margin: clamp(30px, 5vw, 44px) auto 0; width: min(560px, 100%);
    display: grid; grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, 0.02);
  }
  .stat { padding: 18px 8px 16px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat-n { font-size: clamp(24px, 5.5vw, 32px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .stat-l { margin-top: 4px; color: var(--faint); font-size: 12.5px; font-weight: 500; }

  /* ── Toolbar ─────────────────────────────── */
  main { flex: 1; padding-block: clamp(28px, 4vw, 40px) clamp(48px, 7vw, 72px); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg {
    position: relative; display: inline-grid; grid-template-columns: repeat(3, auto);
    padding: 3px; border-radius: 10px; background: var(--surface);
  }
  .seg i {
    position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 8px;
    background: var(--surface-3);
    transition: transform .35s var(--ease), width .35s var(--ease);
  }
  .seg button {
    position: relative; z-index: 1; height: 34px; padding: 0 14px; border-radius: 8px;
    font-size: 14px; font-weight: 550; color: var(--faint); white-space: nowrap;
    transition: color .2s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { color: var(--text); }

  .search { position: relative; flex: 1 1 200px; min-width: 0; }
  .search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search input {
    width: 100%; height: 40px; padding: 0 12px 0 36px; border: 0; border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 15px;
    box-shadow: inset 0 0 0 1px transparent; outline: none; transition: box-shadow .2s;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { box-shadow: inset 0 0 0 1.5px var(--line-2); }

  .count { margin: 18px 0 6px; color: var(--faint); font-size: 13.5px; min-height: 22px; }

  /* ── List ────────────────────────────────── */
  .month {
    margin: 26px 0 12px; color: var(--faint);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .month:first-child { margin-top: 8px; }

  .card {
    --accent: var(--ok);
    position: relative; margin-bottom: 12px;
    background: var(--surface); border-radius: 6px;
    border-left: 4px solid var(--accent);
    transition: background-color .2s, transform .25s var(--ease);
  }
  .card.live { --accent: var(--live); }
  .card:hover { background: var(--surface-2); }
  @media (prefers-reduced-motion: no-preference) {
    .reveal { opacity: 0; transform: translateY(12px); }
    .reveal.in { opacity: 1; transform: none; transition: opacity .55s var(--ease), transform .55s var(--ease), background-color .2s; transition-delay: var(--d, 0s), var(--d, 0s), 0s; }
  }
  .card.flash { animation: flash 2.4s ease-out; }
  @keyframes flash {
    0%, 35% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55), 0 10px 40px -10px rgba(0, 0, 0, 0.6); }
    100% { box-shadow: 0 0 0 2px transparent, 0 10px 40px -10px transparent; }
  }

  .card-in { padding: 18px 20px 14px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .prize { margin: 0; font-size: 17.5px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.35; overflow-wrap: anywhere; }

  .badge {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px 0 8px; border-radius: 999px; white-space: nowrap;
    font-size: 12.5px; font-weight: 600;
    color: var(--ok-text); background: rgba(35, 165, 90, 0.14);
  }
  .badge svg { width: 14px; height: 14px; }
  .badge.live { color: var(--live); background: rgba(240, 178, 50, 0.14); }
  .dot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  @media (prefers-reduced-motion: no-preference) {
    .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: ping 1.8s ease-out infinite; }
  }
  @keyframes ping { from { transform: scale(1); opacity: .6; } to { transform: scale(3.2); opacity: 0; } }

  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 12px 40px; margin: 16px 0 0; }
  .facts div { min-width: 0; }
  .facts dt { font-size: 12.5px; font-weight: 600; color: var(--faint); }
  .facts dd { margin: 2px 0 0; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }

  .winners { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .winners .lbl { font-size: 12.5px; font-weight: 600; color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    height: 32px; padding: 0 12px 0 4px; border-radius: 999px;
    background: var(--bg); font-size: 14.5px; font-weight: 550;
  }
  .chip b {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(150deg, #4a4c52, #2a2b2f); color: #fff;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .none { color: var(--dim); font-size: 14.5px; margin-top: 6px; }

  .actions { display: flex; align-items: center; gap: 4px; margin-top: 12px; margin-inline: -8px; flex-wrap: wrap; }
  .act {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px; border-radius: 8px;
    font-size: 13.5px; font-weight: 550; color: var(--dim);
    transition: background-color .2s, color .2s;
  }
  .act:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
  .act svg { width: 15px; height: 15px; flex: none; }
  .act .ck { display: none; }
  .act.done { color: var(--ok-text); }
  .act.done .cp { display: none; }
  .act.done .ck { display: block; }
  .act.tog { margin-left: auto; }
  .act.tog svg { transition: transform .3s var(--ease); }
  .act.tog[aria-expanded="true"] svg { transform: rotate(180deg); }

  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
  .more.open { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; }
  .rec { margin: 0; padding: 4px 20px 18px; display: grid; gap: 0; border-top: 1px solid var(--line); }
  .rec > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .rec > div:last-of-type { border-bottom: 0; }
  .rec dt { color: var(--faint); }
  .rec dd { margin: 0; color: var(--text); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .rec .note { margin: 4px 0 0; font-size: 13px; color: var(--faint); line-height: 1.55; }
  @media (max-width: 520px) {
    .rec > div { grid-template-columns: 1fr; gap: 2px; }
    .facts { grid-template-columns: repeat(2, minmax(0, auto)); }
  }

  /* States */
  .state { text-align: center; padding: 64px 20px; color: var(--dim); }
  .state h2 { margin: 12px 0 6px; font-size: 18px; font-weight: 650; color: var(--text); }
  .state p { margin: 0 auto; max-width: 40ch; font-size: 15px; }
  .state svg { width: 40px; height: 40px; color: var(--faint); }
  .retry { margin-top: 18px; height: 40px; padding: 0 18px; border-radius: 8px; background: var(--surface-3); font-weight: 600; font-size: 14.5px; transition: background-color .2s; }
  .retry:hover { background: #43454c; }

  .skel { height: 132px; border-radius: 6px; border-left: 4px solid var(--surface-3); margin-bottom: 12px;
    background: linear-gradient(100deg, var(--surface) 30%, #33353b 50%, var(--surface) 70%) 0 0 / 250% 100%; }
  @media (prefers-reduced-motion: no-preference) { .skel { animation: shimmer 1.4s linear infinite; } }
  @keyframes shimmer { to { background-position: -150% 0; } }

  .showmore { display: flex; margin: 20px auto 0; height: 42px; padding: 0 22px; align-items: center; border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 14.5px; transition: background-color .2s; }
  .showmore:hover { background: var(--surface-3); }

  /* ── Footer ──────────────────────────────── */
  footer { border-top: 1px solid var(--line); padding: 34px 0 calc(40px + env(safe-area-inset-bottom)); text-align: center; }
  .social { display: flex; justify-content: center; gap: 12px; }
  .social a { width: 36px; height: 36px; border-radius: 10px; overflow: hidden; opacity: .75; transition: opacity .2s, transform .2s var(--ease); }
  .social a:hover { opacity: 1; transform: translateY(-2px); }
  .social img { width: 100%; height: 100%; filter: grayscale(1) brightness(1.1); transition: filter .25s; }
  .social a:hover img { filter: none; }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <h1>Giveaway Log</h1>
    <p class="sub">Every draw is random and logged automatically at the moment a giveaway closes</p>
    <div class="stats" id="stats" aria-live="polite">
      <div class="stat"><div class="stat-n num" data-k="draws">–</div><div class="stat-l">Draws logged</div></div>
      <div class="stat"><div class="stat-n num" data-k="entries">–</div><div class="stat-l">Total entries</div></div>
      <div class="stat"><div class="stat-n num" data-k="winners">–</div><div class="stat-l">Winners picked</div></div>
    </div>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="toolbar" id="toolbar" hidden>
      <div class="seg" id="seg" role="group" aria-label="Filter draws">
        <i></i>
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="live" aria-pressed="false">Live</button>
        <button type="button" data-f="done" aria-pressed="false">Completed</button>
      </div>
      <label class="search">
        <span class="sr">Search draws</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
        <input id="q" type="search" placeholder="Search prize, winner or message ID" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="content">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>
</main>

<footer>

<script>
const GIST_ID = "55c72e761297a65d901d0f9fad4c4bf5";
const API_URL = `https://api.github.com/gists/${GIST_ID}`;
const PAGE_SIZE = 12;

const state = { all: [], filter: 'all', q: '', limit: PAGE_SIZE, focusId: null };
const $ = (s) => document.querySelector(s);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>',
  tick: '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>',
  copy: '<svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  link: '<svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l1.500 3h5L16 13h4"/><path d="M5.500 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5l2.500-8Z"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.500v.01"/></svg>'
};

/* ── helpers ─────────────────────────────── */
function esc(v) { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
function safeId(v) { return String(v == null ? '' : v).replace(/[^\w-]/g, ''); }
function toDate(iso) { const d = new Date(iso); return isNaN(d) ? null : d; }

const fmtDate = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short' });
const fmtMonth = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });
const fmtUTC = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });

function when(iso) { const d = toDate(iso); return d ? `${fmtDate.format(d)}, ${fmtTime.format(d)}` : '–'; }
function whenUTC(iso) { const d = toDate(iso); return d ? `${fmtUTC.format(d)} UTC` : '–'; }

function untilText(iso) {
  const d = toDate(iso); if (!d) return '';
  let m = Math.max(0, Math.round((d - Date.now()) / 60000));
  if (m < 1) return 'ending now';
  if (m < 60) return `in\u00A0${m}\u00A0min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `in\u00A0${h}\u00A0h${m % 60 ? '\u00A0' + (m % 60) + '\u00A0min' : ''}`;
  return `in\u00A0${Math.floor(h / 24)}\u00A0d`;
}

const isLive = (g) => !g.ended_at && g.ends_at && toDate(g.ends_at) > new Date();
const dateOf = (g) => toDate(g.ended_at || g.ends_at) || new Date(0);

function initial(name) { const m = String(name || '?').match(/[\p{L}\p{N}]/u); return m ? m[0] : '?'; }

/* ── stats ───────────────────────────────── */
function countUp(el, to) {
  if (reduceMotion || to < 2) { el.textContent = to.toLocaleString('en-GB'); return; }
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e).toLocaleString('en-GB');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderStats(list) {
  const v = {
    draws: list.length,
    entries: list.reduce((s, g) => s + (Number(g.entries) || 0), 0),
    winners: list.reduce((s, g) => s + (Array.isArray(g.winners) ? g.winners.length : 0), 0)
  };
  document.querySelectorAll('#stats [data-k]').forEach((el) => countUp(el, v[el.dataset.k]));
}

/* ── cards ───────────────────────────────── */
function cardHTML(g, i) {
  const live = isLive(g);
  const id = safeId(g.message_id);
  const winners = Array.isArray(g.winners) ? g.winners : [];
  const asked = Number(g.winners_requested) || 0;

  const badge = live
    ? `<span class="badge live"><span class="dot"></span>Live</span>`
    : `<span class="badge">${ICON.check}Verified draw</span>`;

  const winnerLabel = winners.length === 1 ? 'Winner' : 'Winners';
  const winnersBlock = live ? '' : `
    <div class="winners">
      <div class="lbl">${winnerLabel}</div>
      ${winners.length
        ? `<div class="chips">${winners.map((w) => `<span class="chip"><b>${esc(initial(w))}</b><span>${esc(w)}</span></span>`).join('')}</div>`
        : `<div class="none">No valid entries</div>`}
    </div>`;

  const dateLabel = live ? 'Ends' : 'Drawn';
  const dateVal = live ? `${when(g.ends_at)}` : when(g.ended_at);
  const winnersFact = live ? (asked || '–') : (asked ? `${winners.length} of ${asked}` : winners.length);

  const rec = `
    <dl class="rec">
      <div><dt>Selection method</dt><dd>Random, among all entries at closing time</dd></div>
      <div><dt>Entries at closing</dt><dd>${esc(g.entries ?? 0)}</dd></div>
      <div><dt>Winners selected</dt><dd>${esc(winners.length)}${asked ? ` (of ${esc(asked)} requested)` : ''}</dd></div>
      <div><dt>${live ? 'Scheduled end' : 'Closed at'}</dt><dd>${esc(whenUTC(live ? g.ends_at : g.ended_at))}</dd></div>
      <div><dt>Discord message ID</dt><dd>${esc(id || '–')}</dd></div>
      <p class="note">Winners are chosen by the Fight Kicks bot at the moment the giveaway closes. Names are shown as they appeared on the server at that time.</p>
    </dl>`;

  return `
  <article class="card reveal${live ? ' live' : ''}" id="g-${id}" data-id="${id}" style="--d:${Math.min(i * 0.045, 0.4)}s">
    <div class="card-in">
      <div class="card-top">
        <h3 class="prize">${esc(g.prize || 'Giveaway')}</h3>
        ${badge}
      </div>
      <dl class="facts">
        <div><dt>Entries</dt><dd>${esc(g.entries ?? 0)}</dd></div>
        <div><dt>${winnerLabel === 'Winner' && !asked ? 'Winner' : 'Winners'}</dt><dd>${esc(winnersFact)}</dd></div>
        <div><dt>${dateLabel}</dt><dd>${esc(dateVal)}${live ? ` · ${esc(untilText(g.ends_at))}` : ''}</dd></div>
      </dl>
      ${winnersBlock}
      <div class="actions">
        <button type="button" class="act" data-copy="link" aria-label="Copy link to this draw">${ICON.link}${ICON.tick}<span>Copy link</span></button>
        ${id ? `<button type="button" class="act" data-copy="id" aria-label="Copy Discord message ID">${ICON.copy}${ICON.tick}<span>Copy ID</span></button>` : ''}
        <button type="button" class="act tog" aria-expanded="false" aria-controls="m-${id}"><span>Draw details</span>${ICON.chev}</button>
      </div>
    </div>
    <div class="more" id="m-${id}"><div>${rec}</div></div>
  </article>`;
}

function matches(g) {
  const live = isLive(g);
  if (state.filter === 'live' && !live) return false;
  if (state.filter === 'done' && live) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [g.prize, g.message_id, ...(Array.isArray(g.winners) ? g.winners : [])].join(' ').toLowerCase();
  return hay.includes(q);
}

function sortList(list) {
  return [...list].sort((a, b) => {
    const al = isLive(a), bl = isLive(b);
    if (al !== bl) return al ? -1 : 1;
    return dateOf(b) - dateOf(a);
  });
}

let io = null;
function observe() {
  if (io) io.disconnect();
  const items = document.querySelectorAll('.reveal:not(.in)');
  if (reduceMotion || !('IntersectionObserver' in window)) { items.forEach((el) => el.classList.add('in')); return; }
  io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -40px 0px' });
  items.forEach((el) => io.observe(el));
}

function render() {
  const content = $('#content');
  const list = sortList(state.all.filter(matches));
  const total = state.all.length;

  if (!total) {
    $('#count').textContent = '';
    content.innerHTML = `<div class="state">${ICON.inbox}<h2>No draws logged yet</h2><p>The first draw will appear here as soon as a giveaway ends.</p></div>`;
    return;
  }

  $('#count').textContent = list.length === total
    ? `${total} ${total === 1 ? 'draw' : 'draws'}`
    : `${list.length} of ${total} draws`;

  if (!list.length) {
    content.innerHTML = `<div class="state">${ICON.inbox}<h2>No results</h2><p>Try a different search or filter</p></div>`;
    return;
  }

  if (state.focusId) {
    const idx = list.findIndex((g) => safeId(g.message_id) === state.focusId);
    if (idx >= state.limit) state.limit = idx + 1;
  }

  const shown = list.slice(0, state.limit);
  let html = '', month = '';
  shown.forEach((g, i) => {
    const m = isLive(g) ? 'Live now' : (toDate(g.ended_at || g.ends_at) ? fmtMonth.format(toDate(g.ended_at || g.ends_at)) : 'Undated');
    if (m !== month) { month = m; html += `<h2 class="month">${esc(m)}</h2>`; }
    html += cardHTML(g, i);
  });
  if (list.length > shown.length) {
    html += `<button type="button" class="showmore" id="showmore">Show ${Math.min(PAGE_SIZE, list.length - shown.length)} more</button>`;
  }
  content.innerHTML = html;
  observe();
}

/* ── interactions ────────────────────────── */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
    } catch (_) { return false; }
  }
}

function toggleMore(card, force) {
  const more = card.querySelector('.more'), btn = card.querySelector('.tog');
  if (!more || !btn) return;
  const open = force !== undefined ? force : !more.classList.contains('open');
  more.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', String(open));
}

document.addEventListener('click', async (e) => {
  const more = e.target.closest('#showmore');
  if (more) { state.limit += PAGE_SIZE; render(); return; }

  const tog = e.target.closest('.tog');
  if (tog) { toggleMore(tog.closest('.card')); return; }

  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const card = cp.closest('.card'), id = card.dataset.id;
    const text = cp.dataset.copy === 'id' ? id : `${location.origin}${location.pathname}#${id}`;
    if (await copyText(text)) {
      cp.classList.add('done');
      const label = cp.querySelector('span'), old = label.textContent;
      label.textContent = 'Copied';
      setTimeout(() => { cp.classList.remove('done'); label.textContent = old; }, 1600);
    }
  }
});

function moveThumb() {
  const seg = $('#seg'), thumb = seg.querySelector('i');
  const on = seg.querySelector('[aria-pressed="true"]');
  thumb.style.width = on.offsetWidth + 'px';
  thumb.style.transform = `translateX(${on.offsetLeft - 3}px)`;
}
$('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]'); if (!b) return;
  state.filter = b.dataset.f; state.limit = PAGE_SIZE;
  document.querySelectorAll('#seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  moveThumb(); render();
});
let qTimer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; state.limit = PAGE_SIZE; render(); }, 120);
});
window.addEventListener('resize', moveThumb);

/* deep link: …/giveaways/#<discord message id> */
function focusFromHash() {
  const id = safeId(decodeURIComponent(location.hash.replace(/^#g?-?/, '')));
  if (!id) return;
  state.focusId = id;
  if (!state.all.some((g) => safeId(g.message_id) === id)) return;
  state.filter = 'all'; state.q = '';
  document.querySelectorAll('#seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.f === 'all')));
  $('#q').value = ''; moveThumb(); render();
  const card = document.getElementById('g-' + id);
  if (!card) return;
  card.classList.add('in');
  toggleMore(card, true);
  requestAnimationFrame(() => {
    card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  });
}
window.addEventListener('hashchange', focusFromHash);

/* ── load ────────────────────────────────── */
async function load() {
  const content = $('#content');
  content.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    const res = await fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 403 ? 'Too many requests, please wait a minute' : `Server responded ${res.status}`);
    const data = await res.json();
    const files = data.files || {};
    const key = Object.keys(files).find((k) => k === 'giveaway_history.json') || Object.keys(files)[0];
    if (!key) throw new Error('Record not found');
    let raw = files[key].content;
    if (files[key].truncated) raw = await (await fetch(files[key].raw_url)).text();
    const parsed = JSON.parse(raw);
    state.all = Array.isArray(parsed.giveaways) ? parsed.giveaways : [];

    $('#toolbar').hidden = state.all.length === 0;
    renderStats(state.all);
    render();
    moveThumb();
    requestAnimationFrame(moveThumb);
    if (location.hash) focusFromHash();
  } catch (err) {
    $('#count').textContent = '';
    content.innerHTML = `
      <div class="state">${ICON.alert}<h2>Couldn’t load the record</h2>
      <p>${esc(err.message)}. Please try again in a moment.</p>
      <button type="button" class="retry" id="retry">Try again</button></div>`;
    $('#retry').addEventListener('click', load);
  }
}
load();
</script>
</body>
</html>
